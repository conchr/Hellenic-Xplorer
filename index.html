<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellenic Score & Tales | Artifact Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect, useCallback, useDeferredValue } = React;
        
        // Lucide Icon Wrapper to fix React child issue
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    const iconFunc = lucide.icons[name];
                    if (iconFunc) {
                        const svg = lucide.createIcons({
                            icons: { [name]: iconFunc },
                            attrs: { size, class: className, fill }
                        });
                    }
                }
            }, [name, size, className, fill]);
            return <i data-lucide={name} className={className} style={{width: size, height: size, display: 'inline-block'}}></i>;
        };

        const STATUS_TYPES = {
            NONE: { label: 'Χωρίς Κατάσταση', color: 'bg-slate-100 text-slate-500', icon: 'Folder' },
            CONSTRUCTION: { label: 'Under Construction', color: 'bg-amber-100 text-amber-700', icon: 'Clock' },
            UPLOADED: { label: 'Uploaded', color: 'bg-blue-100 text-blue-700', icon: 'Upload' },
            POSTED: { label: 'Posted', color: 'bg-green-100 text-green-700', icon: 'Globe' },
            HELP: { label: 'Help Folder', color: 'bg-red-100 text-red-700', icon: 'HelpCircle' }
        };

        const App = () => {
            const [folderStructure, setFolderStructure] = useState(null);
            const [isConfigured, setIsConfigured] = useState(false);
            const [currentFolder, setCurrentFolder] = useState(null);
            const [navigationStack, setNavigationStack] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedAsset, setSelectedAsset] = useState(null);
            const [viewMode, setViewMode] = useState('grid');
            const [error, setError] = useState(null);
            const [analysisLoading, setAnalysisLoading] = useState(false);
            const [smartAnalysis, setSmartAnalysis] = useState(null);
            const [activeStatusFilter, setActiveStatusFilter] = useState('ALL');
            const [folderStatuses, setFolderStatuses] = useState(() => {
                try {
                    const saved = localStorage.getItem('hst_folder_statuses');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });

            const fileInputRef = useRef(null);
            const apiKey = "AIzaSyAyaJWwcOJsjuI5AlB8fFkOW2YOgZTOoDE"; // Provided by execution environment

            useEffect(() => {
                localStorage.setItem('hst_folder_statuses', JSON.stringify(folderStatuses));
            }, [folderStatuses]);

            const hasMediaContent = useCallback((folder) => {
                const hasDirectMedia = folder.children.some(child => ['video', 'audio', 'image'].includes(child.type));
                if (hasDirectMedia) return true;
                return folder.children.some(child => child.type === 'folder' && hasMediaContent(child));
            }, []);

            const buildHierarchyFromFiles = useCallback((fileList) => {
                const root = { name: '', type: 'folder', children: [], path: '' };
                const filesArray = Array.from(fileList);

                filesArray.forEach(file => {
                    const pathParts = file.webkitRelativePath.split('/');
                    if (root.name === '') { root.name = pathParts[0]; root.path = pathParts[0]; }

                    let currentLevel = root;
                    let currentPath = pathParts[0];

                    for (let i = 1; i < pathParts.length; i++) {
                        const part = pathParts[i];
                        currentPath += '/' + part;
                        const isFile = i === pathParts.length - 1;
                        let existing = currentLevel.children.find(c => c.name === part);

                        if (!existing) {
                            if (isFile) {
                                const extension = part.split('.').pop().toLowerCase();
                                let type = 'file';
                                if (['mp4', 'mov', 'avi', 'mkv'].includes(extension)) type = 'video';
                                else if (['mp3', 'wav', 'flac', 'm4a'].includes(extension)) type = 'audio';
                                else if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(extension)) type = 'image';

                                let thumbnail = null;
                                if (type === 'image') { thumbnail = URL.createObjectURL(file); }

                                existing = {
                                    id: Math.random().toString(36).substr(2, 9),
                                    name: part, type, size: `${(file.size / (1024 * 1024)).toFixed(1)} MB`,
                                    myth: pathParts[i - 1], thumbnail, file, path: currentPath
                                };
                                currentLevel.children.push(existing);
                            } else {
                                existing = { name: part, type: 'folder', children: [], path: currentPath };
                                currentLevel.children.push(existing);
                            }
                        }
                        currentLevel = existing;
                    }
                });

                const filterFolders = (folder) => {
                    folder.children = folder.children.filter(child => {
                        if (child.type !== 'folder') return true;
                        const isValid = hasMediaContent(child);
                        if (isValid) filterFolders(child);
                        return isValid;
                    });
                };
                filterFolders(root);
                return root;
            }, [hasMediaContent]);

            const handleFileChange = (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                setIsSyncing(true);
                try {
                    const structure = buildHierarchyFromFiles(files);
                    setFolderStructure(structure);
                    setCurrentFolder(structure);
                    setNavigationStack([structure]);
                    setIsConfigured(true);
                } catch (err) { setError("Σφάλμα στην ανάγνωση."); }
                setIsSyncing(false);
            };

            const performSmartAnalysis = async (asset) => {
                if (asset.type !== 'image' || !apiKey) return;
                setAnalysisLoading(true);
                const reader = new FileReader();
                reader.readAsDataURL(asset.file);
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ role: "user", parts: [{ text: "Analyze for Strategy v9.0. Greek language. JSON: mythName, mythExplanation, behindTheArtifact." }, { inlineData: { mimeType: asset.file.type, data: base64Data } }] }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        const res = await response.json();
                        setSmartAnalysis(JSON.parse(res.candidates[0].content.parts[0].text));
                    } catch (e) { setError("AI failed."); }
                    setAnalysisLoading(false);
                };
            };

            const filteredContent = useMemo(() => {
                if (!currentFolder) return [];
                return currentFolder.children.filter(item => {
                    const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                    const status = folderStatuses[item.path] || 'NONE';
                    const matchesStatus = activeStatusFilter === 'ALL' || status === activeStatusFilter;
                    return item.type === 'folder' ? (matchesSearch && matchesStatus) : matchesSearch;
                });
            }, [currentFolder, searchTerm, folderStatuses, activeStatusFilter]);

            if (!isConfigured) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-white">
                        <input type="file" ref={fileInputRef} webkitdirectory="true" directory="true" className="hidden" onChange={handleFileChange} />
                        <div className="max-w-xl w-full bg-slate-900 rounded-[3rem] p-12 border border-slate-800 shadow-2xl text-center">
                            <div className="flex justify-center mb-8">
                                <div className="w-24 h-24 bg-indigo-600 rounded-[2rem] flex items-center justify-center shadow-2xl">
                                    <Icon name="FolderOpen" size={48} className="text-white" />
                                </div>
                            </div>
                            <h1 className="text-4xl font-black mb-4 tracking-tight">Hellenic Disk Sync</h1>
                            <p className="text-slate-400 text-lg mb-10">Επιλέξτε τον Master Folder για αυτόματη χαρτογράφηση.</p>
                            <button onClick={() => fileInputRef.current.click()} className="w-full bg-white text-slate-900 py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-indigo-50 transition-all flex items-center justify-center gap-4">
                                <Icon name="Upload" size={20} /> Connect Master Archive
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-white/90 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-50 px-8 py-5 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-indigo-950 rounded-xl flex items-center justify-center text-white"><Icon name="ShieldCheck" size={24} /></div>
                            <h1 className="text-xl font-black text-indigo-950 uppercase tracking-tighter">Hellenic Explorer</h1>
                        </div>
                        <div className="flex-1 max-w-xl px-8">
                            <div className="relative">
                                <Icon name="Search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                <input type="text" placeholder="Αναζήτηση..." className="w-full pl-10 pr-6 py-2.5 bg-slate-100 border-transparent rounded-2xl focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all text-sm font-semibold" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        <button onClick={() => setIsConfigured(false)} className="p-2.5 hover:bg-slate-100 rounded-xl transition-colors text-slate-400"><Icon name="Settings" size={20} /></button>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-64 bg-white border-r border-slate-200 p-6 hidden lg:block overflow-y-auto">
                            <button onClick={() => { setNavigationStack([folderStructure]); setCurrentFolder(folderStructure); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold bg-indigo-600 text-white shadow-lg mb-8">
                                <Icon name="Home" size={18} /> Master Folder
                            </button>
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Filters</h3>
                            <div className="space-y-1">
                                <button onClick={() => setActiveStatusFilter('ALL')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold ${activeStatusFilter === 'ALL' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'}`}><Icon name="Filter" size={16} /> All Media</button>
                                {Object.entries(STATUS_TYPES).map(([key, config]) => (
                                    <button key={key} onClick={() => setActiveStatusFilter(key)} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold ${activeStatusFilter === key ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'}`}><Icon name={config.icon} size={16} /> {config.label}</button>
                                ))}
                            </div>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-10 bg-slate-50/50">
                            <div className="mb-8">
                                <div className="flex items-center gap-2 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
                                    {navigationStack.map((f, i) => <span key={i} className="flex items-center gap-1"><span onClick={() => { const s = navigationStack.slice(0, i+1); setNavigationStack(s); setCurrentFolder(s[i]); }} className="hover:text-indigo-600 cursor-pointer">{f.name}</span> {i < navigationStack.length - 1 && <Icon name="ChevronRight" size={10} />}</span>)}
                                </div>
                                <h2 className="text-4xl font-black text-slate-900 tracking-tight">{currentFolder?.name}</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-8">
                                {filteredContent.map((item, idx) => (
                                    <div key={idx} onClick={() => { if(item.type === 'folder') { setNavigationStack([...navigationStack, item]); setCurrentFolder(item); } else setSelectedAsset(item); }} className={`group cursor-pointer bg-white rounded-[2.5rem] border border-slate-200 p-8 transition-all hover:shadow-2xl hover:border-indigo-300 ${item.type === 'folder' ? 'h-52 flex flex-col justify-between' : 'overflow-hidden p-0'}`}>
                                        {item.type === 'folder' ? (
                                            <>
                                                <div className="flex justify-between items-start">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${STATUS_TYPES[folderStatuses[item.path] || 'NONE'].color}`}><Icon name={STATUS_TYPES[folderStatuses[item.path] || 'NONE'].icon} size={28} /></div>
                                                    <button onClick={(e) => { e.stopPropagation(); const keys = Object.keys(STATUS_TYPES); const next = keys[(keys.indexOf(folderStatuses[item.path] || 'NONE') + 1) % keys.length]; setFolderStatuses({...folderStatuses, [item.path]: next}); }} className="p-2 bg-slate-50 rounded-lg hover:bg-slate-200"><Icon name="Tag" size={14} /></button>
                                                </div>
                                                <div><h4 className="font-black text-lg truncate leading-tight mb-1">{item.name}</h4><p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">{item.children.length} Items</p></div>
                                            </>
                                        ) : (
                                            <>
                                                <div className="aspect-video relative bg-slate-100">{item.thumbnail ? <img src={item.thumbnail} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name={item.type === 'video' ? 'Video' : 'Music'} size={40} /></div>}</div>
                                                <div className="p-6"><h4 className="font-black truncate mb-1">{item.name}</h4><div className="flex items-center gap-2 text-[10px] font-black text-indigo-500 uppercase tracking-widest">{item.type} • {item.size}</div></div>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </main>

                        {selectedAsset && (
                            <aside className="w-[450px] bg-white border-l border-slate-200 p-10 overflow-y-auto animate-in">
                                <button onClick={() => { setSelectedAsset(null); setSmartAnalysis(null); }} className="flex items-center gap-2 text-[10px] font-black uppercase text-slate-400 mb-10"><Icon name="ArrowLeft" size={14} /> Back</button>
                                <div className="rounded-[2rem] overflow-hidden shadow-2xl mb-10 aspect-video bg-slate-900 relative">
                                    {selectedAsset.thumbnail ? <img src={selectedAsset.thumbnail} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-white/20"><Icon name={selectedAsset.type === 'video' ? 'Video' : 'Music'} size={48} /></div>}
                                    <div className="absolute bottom-6 left-6 text-white"><h4 className="text-2xl font-black">{smartAnalysis?.mythName || selectedAsset.myth}</h4><p className="text-[10px] font-bold uppercase tracking-widest text-indigo-300">Artifact to Art</p></div>
                                </div>
                                <div className="space-y-8">
                                    {selectedAsset.type === 'image' && !smartAnalysis && <button onClick={() => performSmartAnalysis(selectedAsset)} disabled={analysisLoading} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-indigo-700 transition-all flex items-center justify-center gap-3">{analysisLoading ? <Icon name="RefreshCw" className="animate-spin" /> : <Icon name="Sparkles" />} Identify Theme</button>}
                                    {smartAnalysis && <div className="bg-indigo-50 p-8 rounded-3xl border border-indigo-100"><h5 className="text-[10px] font-black text-indigo-400 uppercase mb-3">AI Insight</h5><p className="text-lg font-bold italic text-slate-800 leading-tight">"{smartAnalysis.mythExplanation}"</p></div>}
                                    <div className="bg-slate-950 text-slate-300 p-8 rounded-3xl"><p className="text-white font-black italic mb-4">"The story is no longer read. It is heard."</p><p className="text-xs leading-relaxed opacity-80">{smartAnalysis?.behindTheArtifact || "Η μουσική σύνθεση μετατρέπει το εύρημα σε τέχνη."}</p></div>
                                </div>
                            </aside>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
